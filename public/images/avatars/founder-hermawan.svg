<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Studio Lighting Gradient (Tech Cyan/Sky Studio) -->
    <radialGradient id="studio-spotlight-tech" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#031522"/>
    </radialGradient>
    <linearGradient id="rim-light-tech" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="suit-tech" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="vignette-tech" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#studio-spotlight-tech)"/>
  <rect width="400" height="400" fill="url(#vignette-tech)"/>

  <!-- Subtle Blueprint Tech Grid / Rings -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="200" cy="180" r="115" fill="none" stroke="#7dd3fc" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Male Tech Executive Silhouette with Suit -->
  <path d="M 60 400 L 95 325 C 115 280 155 260 200 260 C 245 260 285 280 305 325 L 340 400 Z" fill="url(#suit-tech)"/>
  <path d="M 95 325 C 115 280 155 260 200 260 L 175 350 L 130 400 L 60 400 Z" fill="#0c2333"/>
  <path d="M 305 325 C 285 280 245 260 200 260 L 225 350 L 270 400 L 340 400 Z" fill="#0c2333"/>

  <!-- Shirt & Tie -->
  <polygon points="175,250 225,250 200,340" fill="#f0f9ff"/>
  <polygon points="194,260 206,260 210,345 200,360 190,345" fill="#0284c7"/>
  <polygon points="193,252 207,252 204,262 196,262" fill="#0369a1"/>

  <!-- Neck -->
  <path d="M 182 205 L 182 255 C 182 260 218 260 218 255 L 218 205 Z" fill="#334155"/>

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="46" ry="56" fill="#334155"/>

  <!-- Modern Short Tech Hairstyle -->
  <path d="M 152 175 C 150 138 165 118 200 118 C 235 118 250 138 248 175 C 248 158 240 132 200 132 C 160 132 152 158 152 175 Z" fill="#0f172a"/>

  <!-- Rim Light -->
  <path d="M 154 165 C 158 135 178 122 200 120 C 222 122 242 135 246 165" fill="none" stroke="url(#rim-light-tech)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 80 360 C 110 300 150 265 195 262" fill="none" stroke="url(#rim-light-tech)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 320 360 C 290 300 250 265 205 262" fill="none" stroke="url(#rim-light-tech)" stroke-width="2" stroke-linecap="round"/>

  <!-- Badge: Tech & Engineering Star -->
  <g transform="translate(182, 350)">
    <circle cx="18" cy="18" r="16" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
    <path d="M 18 10 L 20.5 15.5 L 26.5 16.2 L 22 20.3 L 23.2 26.2 L 18 23.2 L 12.8 26.2 L 14 20.3 L 9.5 16.2 L 15.5 15.5 Z" fill="#fbbf24"/>
  </g>
</svg>

