<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Studio Lighting Gradient (Teal/Emerald Studio) -->
    <radialGradient id="studio-spotlight-teal" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#041816"/>
    </radialGradient>
    <linearGradient id="rim-light-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="suit-teal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="vignette-teal" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#studio-spotlight-teal)"/>
  <rect width="400" height="400" fill="url(#vignette-teal)"/>

  <!-- Geometric Subtle Backdrop Circles -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#2dd4bf" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="200" cy="180" r="115" fill="none" stroke="#5eead4" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Male Academic Executive Silhouette -->
  <path d="M 60 400 L 95 325 C 115 280 155 260 200 260 C 245 260 285 280 305 325 L 340 400 Z" fill="url(#suit-teal)"/>
  <path d="M 95 325 C 115 280 155 260 200 260 L 175 350 L 130 400 L 60 400 Z" fill="#13232b"/>
  <path d="M 305 325 C 285 280 245 260 200 260 L 225 350 L 270 400 L 340 400 Z" fill="#13232b"/>

  <!-- Shirt & Tie -->
  <polygon points="175,250 225,250 200,340" fill="#f0fdfa"/>
  <polygon points="194,260 206,260 210,345 200,360 190,345" fill="#0f766e"/>
  <polygon points="193,252 207,252 204,262 196,262" fill="#115e59"/>

  <!-- Neck -->
  <path d="M 182 205 L 182 255 C 182 260 218 260 218 255 L 218 205 Z" fill="#334155"/>

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="46" ry="56" fill="#334155"/>

  <!-- Hair / Academic cut -->
  <path d="M 152 175 C 150 138 165 118 200 118 C 235 118 250 138 248 175 C 248 158 240 132 200 132 C 160 132 152 158 152 175 Z" fill="#0f172a"/>
  
  <!-- Subtle Glasses Silhouette Accent -->
  <rect x="172" y="172" width="22" height="14" rx="3" fill="none" stroke="#5eead4" stroke-width="1.8" opacity="0.65"/>
  <rect x="206" y="172" width="22" height="14" rx="3" fill="none" stroke="#5eead4" stroke-width="1.8" opacity="0.65"/>
  <line x1="194" y1="179" x2="206" y2="179" stroke="#5eead4" stroke-width="1.8" opacity="0.65"/>

  <!-- Rim Light -->
  <path d="M 154 165 C 158 135 178 122 200 120 C 222 122 242 135 246 165" fill="none" stroke="url(#rim-light-teal)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 80 360 C 110 300 150 265 195 262" fill="none" stroke="url(#rim-light-teal)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 320 360 C 290 300 250 265 205 262" fill="none" stroke="url(#rim-light-teal)" stroke-width="2" stroke-linecap="round"/>

  <!-- Badge: Science & Physics Star -->
  <g transform="translate(182, 350)">
    <circle cx="18" cy="18" r="16" fill="#0f766e" stroke="#ffffff" stroke-width="2"/>
    <path d="M 18 10 L 20.5 15.5 L 26.5 16.2 L 22 20.3 L 23.2 26.2 L 18 23.2 L 12.8 26.2 L 14 20.3 L 9.5 16.2 L 15.5 15.5 Z" fill="#fbbf24"/>
  </g>
</svg>

