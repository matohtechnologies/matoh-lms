<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Studio Lighting Gradient -->
    <radialGradient id="studio-spotlight-1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <!-- Rim Light Gradient -->
    <linearGradient id="rim-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="suit-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="tie-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="face-silhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Subtle Texture/Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="400" height="400" fill="url(#studio-spotlight-1)"/>
  <rect width="400" height="400" fill="url(#vignette)"/>

  <!-- Geometric Subtle Backdrop Circles -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#60a5fa" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="200" cy="180" r="115" fill="none" stroke="#93c5fd" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Male Executive Silhouette with Suit & Tie -->
  <!-- Shoulders & Suit Base -->
  <path d="M 60 400 L 95 325 C 115 280 155 260 200 260 C 245 260 285 280 305 325 L 340 400 Z" fill="url(#suit-grad)"/>

  <!-- Suit Lapels & Shoulder Highlights -->
  <path d="M 95 325 C 115 280 155 260 200 260 L 175 350 L 130 400 L 60 400 Z" fill="#1e293b"/>
  <path d="M 305 325 C 285 280 245 260 200 260 L 225 350 L 270 400 L 340 400 Z" fill="#1e293b"/>

  <!-- Left Lapel Highlight -->
  <path d="M 150 268 L 175 350 L 188 350 L 165 264 Z" fill="#334155"/>
  <!-- Right Lapel Highlight -->
  <path d="M 250 268 L 225 350 L 212 350 L 235 264 Z" fill="#334155"/>

  <!-- Shirt V-Neck Area -->
  <polygon points="175,250 225,250 200,340" fill="url(#shirt-grad)"/>

  <!-- Professional Blue Tie -->
  <polygon points="194,260 206,260 210,345 200,360 190,345" fill="url(#tie-grad)"/>
  <!-- Tie Knot -->
  <polygon points="193,252 207,252 204,262 196,262" fill="#1e40af"/>

  <!-- Neck -->
  <path d="M 182 205 L 182 255 C 182 260 218 260 218 255 L 218 205 Z" fill="url(#face-silhouette)"/>

  <!-- Head & Hair Silhouette -->
  <!-- Head base -->
  <ellipse cx="200" cy="180" rx="46" ry="56" fill="url(#face-silhouette)"/>
  
  <!-- Professional Hairstyle -->
  <path d="M 152 175 C 150 140 165 120 200 118 C 235 120 250 140 248 175 C 248 160 240 135 200 135 C 160 135 152 160 152 175 Z" fill="#0f172a"/>
  <!-- Subtle Hair Rim Highlight -->
  <path d="M 154 165 C 158 135 178 122 200 120 C 222 122 242 135 246 165" fill="none" stroke="url(#rim-light)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Rim Light on Shoulders -->
  <path d="M 80 360 C 110 300 150 265 195 262" fill="none" stroke="url(#rim-light)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 320 360 C 290 300 250 265 205 262" fill="none" stroke="url(#rim-light)" stroke-width="2" stroke-linecap="round"/>

  <!-- Bottom Badge Icon: Official Academic/Leadership Star -->
  <g transform="translate(182, 350)">
    <circle cx="18" cy="18" r="16" fill="#1e40af" stroke="#ffffff" stroke-width="2"/>
    <path d="M 18 10 L 20.5 15.5 L 26.5 16.2 L 22 20.3 L 23.2 26.2 L 18 23.2 L 12.8 26.2 L 14 20.3 L 9.5 16.2 L 15.5 15.5 Z" fill="#fbbf24"/>
  </g>
</svg>

