
name: Build LMS Platform

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build production
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: https://matohtechnologies.com
          NEXT_PUBLIC_APP_URL: https://matohtechnologies.com
          DATABASE_URL: ${{ secrets.BUILD_DATABASE_URL }}
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY }}
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_MIDTRANS_CLIENT_KEY }}
          MIDTRANS_IS_PRODUCTION: "false"

      - name: Prepare standalone package
        run: |
          test -f .next/standalone/server.js
          test -d .next/standalone/.next
          test -d .next/static

          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static

          if [ -d public ]; then
            cp -a public .next/standalone/public
          fi

          test -f .next/standalone/.next/BUILD_ID

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: lms-platform-standalone
          path: .next/standalone/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7