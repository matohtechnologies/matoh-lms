
name: Build and Deploy LMS Platform

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lms-platform-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build production
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: https://matohtechnologies.com
          NEXT_PUBLIC_APP_URL: https://matohtechnologies.com
          DATABASE_URL: ${{ secrets.BUILD_DATABASE_URL }}
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY }}
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_MIDTRANS_CLIENT_KEY }}
          MIDTRANS_IS_PRODUCTION: "false"

      - name: Prepare standalone package
        run: |
          test -f .next/standalone/server.js
          test -d .next/standalone/.next
          test -d .next/static

          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static

          # Sinkronkan public ke lokasi yang benar
          rm -rf .next/standalone/public
          if [ -d public ]; then
            cp -a public .next/standalone/public
          fi

          # Sertakan folder prisma untuk sinkronisasi database di VPS
          rm -rf .next/standalone/prisma
          if [ -d prisma ]; then
            cp -a prisma .next/standalone/prisma
          fi

          test -f .next/standalone/.next/BUILD_ID
          test -f .next/standalone/public/gambar-heading.svg

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: lms-platform-standalone
          path: .next/standalone/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download standalone artifact
        uses: actions/download-artifact@v4
        with:
          name: lms-platform-standalone
          path: standalone

      - name: Package release
        run: tar -czf lms-platform-release.tar.gz -C standalone .

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Clean up disk space on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'CLEANUP'
          set -eu
          echo "=== Pembersihan Disk VPS Sebelum Upload ==="
          # 1. Hapus arsip tar.gz lama di home lmsapp
          rm -f /home/lmsapp/*.tar.gz /home/lmsapp/lms-platform-*.tar.gz 2>/dev/null || true

          # 2. Hapus cache npm dan cache sementara
          rm -rf /home/lmsapp/.npm /home/lmsapp/.cache /tmp/lms* 2>/dev/null || true

          # 3. Hapus folder release lama di /var/www/lms-platform/releases (simpan rilis aktif dan shared)
          BASE="/var/www/lms-platform"
          if [ -d "$BASE/releases" ]; then
            CURRENT_TARGET="$(readlink -f "$BASE/releases/current" 2>/dev/null || echo "")"
            for dir in "$BASE/releases"/*; do
              if [ -d "$dir" ] && [ "$dir" != "$BASE/releases/current" ] && [ "$dir" != "$BASE/releases/shared" ] && [ "$dir" != "$CURRENT_TARGET" ]; then
                echo "Membersihkan folder release lama: $dir"
                rm -rf "$dir" 2>/dev/null || true
              fi
            done
          fi

          echo "Kapasitas disk setelah dibersihkan:"
          df -h /
          CLEANUP

      - name: Upload release to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -eu
          scp -O lms-platform-release.tar.gz \
            "$VPS_USER@$VPS_HOST:/home/lmsapp/lms-platform-${GITHUB_SHA}.tar.gz"

      - name: Activate release and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -Eeuo pipefail

          BASE=/var/www/lms-platform
          SHA="$1"
          RELEASE="$BASE/releases/$SHA"
          CURRENT="$BASE/releases/current"
          ARCHIVE="/home/lmsapp/lms-platform-$SHA.tar.gz"

          OLD_RELEASE="$(readlink -f "$CURRENT" 2>/dev/null || true)"

          mkdir -p "$RELEASE"
          tar -xzf "$ARCHIVE" -C "$RELEASE"

          test -f "$RELEASE/server.js"
          test -f "$RELEASE/.next/BUILD_ID"

          # Tautkan .env dari shared base jika ada
          if [ -f "$BASE/.env" ]; then
            ln -sfn "$BASE/.env" "$RELEASE/.env"
          elif [ -f "$BASE/shared/.env" ]; then
            ln -sfn "$BASE/shared/.env" "$RELEASE/.env"
          fi

          chown -R lmsapp:lmsapp "$RELEASE"

          ln -sfn "$RELEASE" "$CURRENT"

          if ! sudo -n /usr/bin/systemctl restart lms-platform; then
            echo "Restart gagal; mengembalikan release sebelumnya."
            if [ -n "$OLD_RELEASE" ] && [ -d "$OLD_RELEASE" ]; then
              ln -sfn "$OLD_RELEASE" "$CURRENT"
              sudo -n /usr/bin/systemctl restart lms-platform || true
            fi
            exit 1
          fi

          OK=0
          for i in $(seq 1 15); do
            # 1. Prioritaskan pengecekan endpoint /api/health
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 http://127.0.0.1:3000/api/health || true)
            if [ "$HTTP_CODE" = "200" ]; then
              OK=1
              break
            fi

            # 2. Fallback: cek rute root, terima status 200 atau 503 (saat maintenance mode aktif)
            ROOT_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 http://127.0.0.1:3000/ || true)
            if [ "$ROOT_CODE" = "200" ] || [ "$ROOT_CODE" = "503" ]; then
              OK=1
              break
            fi

            sleep 2
          done

          if [ "$OK" -ne 1 ]; then
            echo "Health check gagal; rollback."
            if [ -n "$OLD_RELEASE" ] && [ -d "$OLD_RELEASE" ]; then
              ln -sfn "$OLD_RELEASE" "$CURRENT"
              sudo -n /usr/bin/systemctl restart lms-platform || true
            fi
            exit 1
          fi

          sudo -n /usr/bin/systemctl is-active lms-platform
          rm -f "$ARCHIVE"
          echo "Deployment berhasil: $SHA"
          REMOTE
